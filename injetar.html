<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Injetar Dados - AnimalControl</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 30px 15px;
        background-color: #f7f9fc;
      }
      .btn {
        border: none;
        padding: 15px 25px;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        margin: 10px 5px;
      }
      #btn-login {
        background-color: #4285f4;
        color: white;
      }
      #btn-injetar {
        background-color: #f39c12;
        color: white;
      }
      #btn-injetar:disabled {
        background-color: #bdc3c7;
        cursor: not-allowed;
      }
      #status {
        margin-top: 20px;
        font-size: 18px;
        color: #2c3e50;
        word-break: break-word;
      }
      .escondido {
        display: none;
      }
    </style>
  </head>
  <body>
    <h2>Ferramenta de Injeção de Dados Fictícios</h2>
    <p>
      Conecte sua conta para vincular os dados fictícios de coelhos, partos e
      finanças ao seu usuário.
    </p>

    <div>
      <button id="btn-login" class="btn">🔑 1. Entrar com Google</button>
      <button id="btn-injetar" class="btn escondido">
        🚀 2. Injetar Dados no Firebase
      </button>
    </div>

    <p id="status"></p>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import {
        getFirestore,
        collection,
        addDoc,
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
      import {
        getAuth,
        signInWithPopup,
        signInWithRedirect,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBAiMP11gBfJuWKdo7qyIwHSk7L6Bb0BZ4",
        authDomain: "animalcontrol-3e82d.firebaseapp.com",
        projectId: "animalcontrol-3e82d",
        storageBucket: "animalcontrol-3e82d.firebasestorage.app",
        messagingSenderId: "314778179089",
        appId: "1:314778179089:web:fe34e43f218b90ecea03b0",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);
      const provider = new (
        await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js")
      ).GoogleAuthProvider();

      const btnLogin = document.getElementById("btn-login");
      const btnInjetar = document.getElementById("btn-injetar");
      const status = document.getElementById("status");

      let usuarioLogado = null;

      // 1. MONITORAR AUTENTICAÇÃO
      onAuthStateChanged(auth, (user) => {
        if (user) {
          usuarioLogado = user;
          btnLogin.innerText = `👤 Conectado: ${user.displayName.split(" ")[0]}`;
          btnLogin.style.backgroundColor = "#27ae60";
          btnInjetar.classList.remove("escondido");
          status.innerHTML =
            "✅ Login efetuado! Clique no botão de injetar dados.";
          status.style.color = "#27ae60";
        } else {
          usuarioLogado = null;
          btnLogin.innerText = "🔑 1. Entrar com Google";
          btnLogin.style.backgroundColor = "#4285F4";
          btnInjetar.classList.add("escondido");
          status.innerHTML =
            "Faça o login primeiro para associar os dados à sua conta.";
          status.style.color = "#7f8c8d";
        }
      });

      // 2. AÇÃO DE LOGIN COM TRATAMENTO DE POP-UP BLOQUEADO
      btnLogin.addEventListener("click", async () => {
        try {
          await signInWithPopup(auth, provider);
        } catch (err) {
          console.warn(
            "Pop-up bloqueado ou com falha. Tentando login por redirecionamento...",
            err,
          );
          try {
            await signInWithRedirect(auth, provider);
          } catch (redErr) {
            console.error("Erro ao redirecionar:", redErr);
            alert("Falha no login com o Google.");
          }
        }
      });

      // 3. INJEÇÃO DOS DADOS VINCULADOS AO USERID
      btnInjetar.addEventListener("click", async () => {
        if (!usuarioLogado) {
          alert("Realize o login antes de enviar os dados.");
          return;
        }

        btnInjetar.disabled = true;
        btnLogin.disabled = true;
        status.innerHTML = "⏳ Enviando dados para o Firebase... Aguarde!";
        status.style.color = "#e67e22";

        try {
          const uid = usuarioLogado.uid;

          // 1. GERAR COELHOS VINCULADOS AO USUÁRIO
          const coelhosMock = [
            {
              numero: "001",
              nome: "Pernalonga",
              raca: "Nova Zelândia",
              sexo: "Macho",
              nascimento: "2025-01-15",
              status: "Vivo",
              foto: "",
            },
            {
              numero: "002",
              nome: "Floquinho",
              raca: "Lionhead",
              sexo: "Macho",
              nascimento: "2025-03-20",
              status: "Vivo",
              foto: "",
            },
            {
              numero: "003",
              nome: "Branca",
              raca: "Nova Zelândia",
              sexo: "Fêmea",
              nascimento: "2025-02-10",
              status: "Vivo",
              foto: "",
            },
            {
              numero: "004",
              nome: "Luna",
              raca: "Borboleta",
              sexo: "Fêmea",
              nascimento: "2025-05-05",
              status: "Vivo",
              foto: "",
            },
            {
              numero: "005",
              nome: "Pretinha",
              raca: "Nova Zelândia",
              sexo: "Fêmea",
              nascimento: "2025-01-20",
              status: "Óbito",
              dataObito: "2026-06-10",
              foto: "",
            },
          ];
          for (let c of coelhosMock) {
            await addDoc(collection(db, "coelhos"), {
              ...c,
              userId: uid,
              dataCadastro: new Date(),
            });
          }

          // 2. GERAR PARTOS FINALIZADOS VINCULADOS AO USUÁRIO
          const partosMock = [
            {
              femea: "Branca | #003",
              macho: "Pernalonga | #001",
              dataCruzamento: "2026-01-10",
              dataPrevistaParto: "2026-02-09",
              status: "Desmame Concluído",
              vivos: 8,
              mortos: 1,
              dataNascimentoReal: "2026-02-09",
              desmamados: 7,
              pesoMedio: "0.850",
              dataDesmameReal: "2026-03-15",
              obsDesmame: "Matriz excelente de leite.",
            },
            {
              femea: "Luna | #004",
              macho: "Floquinho | #002",
              dataCruzamento: "2026-03-01",
              dataPrevistaParto: "2026-03-31",
              status: "Desmame Concluído",
              vivos: 6,
              mortos: 0,
              dataNascimentoReal: "2026-03-30",
              desmamados: 6,
              pesoMedio: "0.920",
              dataDesmameReal: "2026-05-05",
              obsDesmame: "Todos saudáveis, para venda.",
            },
            {
              femea: "Branca | #003",
              macho: "Floquinho | #002",
              dataCruzamento: "2026-05-15",
              dataPrevistaParto: "2026-06-14",
              status: "Desmame Concluído",
              vivos: 9,
              mortos: 2,
              dataNascimentoReal: "2026-06-15",
              desmamados: 6,
              pesoMedio: "0.780",
              dataDesmameReal: "2026-07-20",
              obsDesmame: "Perda na amamentação por frio.",
            },
            {
              femea: "Luna | #004",
              macho: "Pernalonga | #001",
              dataCruzamento: "2026-08-20",
              dataPrevistaParto: "2026-09-19",
              status: "Aguardando Nascimento",
            },
          ];
          for (let p of partosMock) {
            await addDoc(collection(db, "partos"), {
              ...p,
              userId: uid,
              dataCadastro: new Date(),
            });
          }

          // 3. GERAR FINANÇAS VINCULADAS AO USUÁRIO
          const financasMock = [
            {
              tipo: "Entrada",
              data: "2026-03-20",
              valor: 450.0,
              categoria: "Compra/Venda de Coelho",
              descricao: "Venda de 5 filhotes da ninhada 1",
            },
            {
              tipo: "Saída",
              data: "2026-03-25",
              valor: 180.0,
              categoria: "Ração e Alimentação",
              descricao: "Compra 2 sacos de ração 20kg",
            },
            {
              tipo: "Saída",
              data: "2026-04-10",
              valor: 65.0,
              categoria: "Medicamentos/Veterinário",
              descricao: "Vitaminas e vermífugo",
            },
            {
              tipo: "Entrada",
              data: "2026-05-15",
              valor: 540.0,
              categoria: "Compra/Venda de Coelho",
              descricao: "Venda de 6 filhotes da ninhada 2",
            },
            {
              tipo: "Saída",
              data: "2026-06-05",
              valor: 350.0,
              categoria: "Acessórios e Instalações",
              descricao: "Compra de 2 novas gaiolas de engorda",
            },
            {
              tipo: "Saída",
              data: "2026-07-02",
              valor: 200.0,
              categoria: "Ração e Alimentação",
              descricao: "Compra ração peletizada",
            },
            {
              tipo: "Entrada",
              data: "2026-08-01",
              valor: 360.0,
              categoria: "Compra/Venda de Coelho",
              descricao: "Venda de 4 filhotes",
            },
          ];
          for (let f of financasMock) {
            await addDoc(collection(db, "financeiro"), {
              ...f,
              userId: uid,
              dataCadastro: new Date(),
            });
          }

          status.innerHTML =
            "✅ <strong>Sucesso!</strong> Os dados foram vinculados à sua conta com sucesso! Pode fechar esta aba e retornar ao app principal.";
          status.style.color = "#27ae60";
        } catch (e) {
          console.error(e);
          status.innerHTML =
            "❌ <strong>Erro:</strong> Houve um problema na gravação. Verifique as regras do seu Firestore no console do Firebase.";
          status.style.color = "#e74c3c";
          btnInjetar.disabled = false;
          btnLogin.disabled = false;
        }
      });
    </script>
  </body>
</html>
