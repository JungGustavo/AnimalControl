<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestão de Coelhos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>🐰 Meu Cunicultor</h1>

      <!-- Menu de Navegação Rolável para Celular -->
      <nav class="menu-superior">
        <button id="tab-coelhos" class="aba-ativa">Coelhos</button>
        <button id="tab-cobertura">Coberturas</button>
        <button id="tab-partos">Partos</button>
        <button id="tab-financeiro">Financeiro</button>
      </nav>

      <!-- SESSÃO 1: COELHOS -->
      <section id="sec-coelhos">
        <div class="acoes-topo">
          <h2>Lista de Coelhos</h2>
          <button id="btn-mostrar-form-coelho" class="btn-acao">
            + Coelho
          </button>
        </div>

        <form id="form-coelho" class="escondido">
          <div class="form-group">
            <label>Número/ID</label><input type="text" id="numero" required />
          </div>
          <div class="form-group">
            <label>Nome</label><input type="text" id="nome" required />
          </div>
          <div class="form-group">
            <label>Raça</label><input type="text" id="raca" required />
          </div>
          <div class="form-group">
            <label>Sexo</label>
            <select id="sexo" required>
              <option value="">Selecione...</option>
              <option value="Macho">Macho</option>
              <option value="Fêmea">Fêmea</option>
            </select>
          </div>
          <div class="form-group">
            <label>Data Nascimento</label
            ><input type="date" id="nascimento" required />
          </div>
          <div class="form-group">
            <label>Foto do Coelho</label>
            <div class="foto-upload-container">
              <label for="foto" class="foto-placeholder-box">
                <span id="foto-texto">📸 Clique para foto</span>
                <img id="preview-foto" alt="Prévia" />
              </label>
              <input type="file" id="foto" accept="image/*" required />
            </div>
          </div>
          <div class="form-group">
            <label>Observações</label
            ><textarea id="observacoes" rows="2"></textarea>
          </div>

          <div class="botoes-form">
            <button type="submit" id="btn-cadastrar-coelho">
              Salvar Coelho
            </button>
            <button type="button" id="btn-cancelar-coelho" class="btn-cancelar">
              Cancelar
            </button>
          </div>
        </form>

        <!-- Filtros omitidos aqui no HTML para não ficar gigante, mas eles estão presentes (mesmo código de antes) -->
        <div class="filtros-container">
          <div class="filtros-grid">
            <div class="form-group">
              <input
                type="text"
                id="filtro-nome"
                placeholder="🔍 Buscar nome..."
              />
            </div>
            <div class="form-group">
              <input
                type="text"
                id="filtro-raca"
                placeholder="🔍 Buscar raça..."
              />
            </div>
            <div class="form-group">
              <input type="date" id="filtro-nascimento" />
            </div>
            <div class="form-group">
              <select id="filtro-sexo">
                <option value="">Todos os sexos</option>
                <option value="Macho">Macho</option>
                <option value="Fêmea">Fêmea</option>
              </select>
            </div>
          </div>
          <button id="btn-limpar-filtros" class="btn-secundario">
            Limpar Filtros
          </button>
        </div>

        <div id="lista-coelhos"></div>
      </section>

      <!-- SESSÃO 2: COBERTURA (NOVA) -->
      <section id="sec-cobertura" class="escondido">
        <div class="acoes-topo">
          <h2>Histórico de Coberturas</h2>
          <button id="btn-mostrar-form-cobertura" class="btn-acao">
            + Cobertura
          </button>
        </div>

        <form id="form-cobertura" class="escondido">
          <div class="form-group">
            <label>Selecione a Fêmea</label>
            <select id="cobertura-femea" required></select>
          </div>
          <div class="form-group">
            <label>Selecione o Macho</label>
            <select id="cobertura-macho" required></select>
          </div>
          <div class="form-group">
            <label>Data da Cobertura</label>
            <input type="date" id="data-cobertura" required />
          </div>
          <div class="botoes-form">
            <button type="submit" id="btn-cadastrar-cobertura">
              Salvar Cobertura
            </button>
            <button
              type="button"
              id="btn-cancelar-cobertura"
              class="btn-cancelar"
            >
              Cancelar
            </button>
          </div>
        </form>

        <div id="lista-coberturas"></div>
      </section>

      <!-- SESSÃO 3: PARTOS (Será alterada no futuro) -->
      <section id="sec-partos" class="escondido">
        <div class="acoes-topo">
          <h2>Controle de Partos</h2>
        </div>

        <!-- Formulário para registrar os nascimentos (oculto por padrão) -->
        <form
          id="form-registro-parto"
          class="escondido"
          style="
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 2px solid #9b59b6;
          "
        >
          <h3 style="margin-bottom: 15px; color: #8e44ad">
            Quantos filhotes nasceram?
          </h3>
          <input type="hidden" id="id-parto-atual" />

          <div class="form-group">
            <label>Filhotes Vivos</label>
            <input type="number" id="qtd-vivos" min="0" required />
          </div>
          <div class="form-group">
            <label>Filhotes Mortos</label>
            <input type="number" id="qtd-mortos" min="0" value="0" required />
          </div>

          <div class="botoes-form">
            <button type="submit" style="background-color: #9b59b6">
              Salvar Nascimento
            </button>
            <button
              type="button"
              id="btn-cancelar-registro"
              class="btn-cancelar"
            >
              Cancelar
            </button>
          </div>
        </form>

        <p
          id="texto-ajuda-partos"
          style="font-size: 13px; color: #666; margin-bottom: 15px"
        >
          Os partos aparecem aqui automaticamente após o registro de uma
          cobertura.
        </p>

        <div id="lista-partos"></div>
      </section>

      <!-- SESSÃO 4: FINANCEIRO (NOVA) -->
      <section id="sec-financeiro" class="escondido">
        <div class="acoes-topo">
          <h2>Financeiro</h2>
        </div>
        <div style="text-align: center; padding: 40px 0">
          <h3 style="color: #7f8c8d">💰 Em breve!</h3>
          <p style="color: #95a5a6; margin-top: 10px">
            Aqui faremos o controle de despesas e receitas da criação.
          </p>
        </div>
      </section>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
