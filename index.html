<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Coelhos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>🐰 Cadastro de Coelhos</h1>

      <form id="form-coelho">
        <div class="form-group">
          <label for="numero">Número/ID</label>
          <input type="text" id="numero" placeholder="Ex: 001" required />
        </div>

        <div class="form-group">
          <label for="nome">Nome do Coelho</label>
          <input type="text" id="nome" placeholder="Ex: Floquinho" required />
        </div>

        <div class="form-group">
          <label for="raca">Raça</label>
          <input type="text" id="raca" placeholder="Ex: Lionhead" required />
        </div>

        <div class="form-group">
          <label for="sexo">Sexo</label>
          <select id="sexo" required>
            <option value="">Selecione...</option>
            <option value="Macho">Macho</option>
            <option value="Fêmea">Fêmea</option>
          </select>
        </div>

        <div class="form-group">
          <label for="nascimento">Data de Nascimento</label>
          <input type="date" id="nascimento" required />
        </div>

        <div class="form-group">
          <label>Foto do Coelho</label>
          <!-- Escondemos o input original e criamos uma área clicável -->
          <div class="foto-upload-container">
            <label for="foto" class="foto-placeholder-box">
              <span id="foto-texto">📸 Clique para escolher uma foto</span>
              <img id="preview-foto" alt="Prévia da foto" />
            </label>
            <input type="file" id="foto" accept="image/*" />
          </div>
        </div>

        <div class="form-group">
          <label for="observacoes">Observações</label>
          <textarea
            id="observacoes"
            rows="3"
            placeholder="Detalhes de saúde, pelagem, etc."
          ></textarea>
        </div>

        <button type="submit" id="btn-cadastrar">Cadastrar Coelho</button>
      </form>

      <div class="lista-container">
        <h2>Coelhos Cadastrados</h2>

          <!-- Nova Área de Filtros -->
          <div class="filtros-container">
            <div class="filtros-grid">
              <div class="form-group">
                <input
                  type="text"
                  id="filtro-nome"
                  placeholder="🔍 Buscar por nome..."
                />
              </div>
              <div class="form-group">
                <input
                  type="text"
                  id="filtro-raca"
                  placeholder="🔍 Buscar por raça..."
                />
              </div>
              <div class="form-group">
                <input type="date" id="filtro-nascimento" />
              </div>
              <div class="form-group">
                <select id="filtro-sexo">
                  <option value="">Todos os sexos</option>
                  <option value="Macho">Macho</option>
                  <option value="Fêmea">Fêmea</option>
                </select>
              </div>
            </div>
            <button id="btn-limpar-filtros" class="btn-secundario">
              Limpar Filtros
            </button>
          </div>

          <div id="lista-coelhos"></div>
        </div>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
