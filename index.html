<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Coelhos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>🐰 Cadastro de Coelhos</h1>

      <form id="form-coelho">
        <div class="form-group">
          <label for="nome">Nome do Coelho</label>
          <input type="text" id="nome" placeholder="Ex: Floquinho" required />
        </div>

        <div class="form-group">
          <label for="raca">Raça</label>
          <input type="text" id="raca" placeholder="Ex: Lionhead" required />
        </div>

        <div class="form-group">
          <label for="idade">Idade (meses)</label>
          <input type="number" id="idade" placeholder="Ex: 12" required />
        </div>

        <button type="submit" id="btn-cadastrar">Cadastrar Coelho</button>
      </form>

      <div class="lista-container">
        <h2>Coelhos Cadastrados</h2>
        <div id="lista-coelhos">
          <!-- Os coelhos aparecerão aqui -->
        </div>
      </div>
    </div>

    <!-- O type="module" é essencial para usar a versão mais recente do Firebase -->
    <script type="module" src="app.js"></script>
  </body>
</html>
